# Upstream CI for the bootstrap_agentic_workspace.sh product repo.
# This repo is driven by a private nested install (workflow/, git-excluded), so CI sees
# no workspace state: it checks the product only. The shipped adopter CI seed lives at
# payload/github/workflows/workspace-ci.yml and never runs here.
name: upstream-ci

on:
  push:
  pull_request:

jobs:
  product:
    name: build parity and retrofit smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is stamped as work lands on main (python3 installer/build.py --release), which
      # folds and deletes every changelog.d fragment. A fragment on main is a forgotten stamp.
      - name: no pending release fragment on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pending=$(find changelog.d -maxdepth 1 -type f -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "A pending release fragment reached main; stamp it with: python3 installer/build.py --release" >&2
            echo "$pending" >&2
            exit 1
          fi

      - name: installer artifact parity
        run: python3 installer/build.py --check

      - name: retrofit smoke
        run: bash tests/retrofit_smoke.sh
