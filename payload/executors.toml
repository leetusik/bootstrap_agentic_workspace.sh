# Executor route table: per-row overrides of the engine's defaults.
#
# The engine owns one route table; this file overrides it row by row. The
# orchestrator passes each dispatch the row's model and effort; the agent
# files' frontmatter is only the fallback. Show the resolved table, or the
# routing decision for one slice, with
#
#   python3 scripts/workflow.py executor-route [<slice_id> [--retry]]
#
# and apply an edit to the agent files with
#
#   python3 scripts/workflow.py sync-agents
#
# The rows (default; what each serves). high, research, mid and cheap all
# run the one slice executor (.claude/agents/slice-executor.md), whose
# frontmatter carries the mid row; the others pass their model per dispatch.
#   high      opus @ high    review, decomposition, the co-work mockup span,
#                            any risk but low, every second attempt
#   research  opus @ high    research slices, by kind
#   design    opus @ high    design-drafter (its own agent file); not a slice
#                            route: executor-route --drafter
#   critic    opus @ high    design-critic (its own agent file), judging each
#                            drafted round: executor-route --critic
#   judge     opus @ high    design-critic in judge mode, ruling on the items
#                            the critic escalates (alias only): --judge
#   mid       opus @ medium  implementation and fix rated low (the default)
#   cheap     haiku @ xhigh  docs and qa rated low; falls back to the mid row
#                            where `haiku` is not Haiku 5.5 (below)
#   explore   haiku @ xhigh  read-only lookups (.claude/agents/Explore.md)
#
# Grammar: [claude.<row>] tables holding model = "..." and effort = "...",
# double-quoted. effort is low, medium, high, xhigh or max, or "" to write no
# effort line and pass no effort (for a model that rejects the parameter).
# mid, design, critic and explore own an agent file, so they also take a full
# model id or "inherit"; high, research, cheap and judge run a file another row
# owns, so they take an Agent-tool alias only (opus, sonnet, haiku, fable).
# The critic and the judge may run on the drafter's model (no row must differ).
#
# From v52 or earlier: a top-level mode = "..." line is refused since v53 —
# delete it. flex was xhigh on both executors; to keep it, set effort = "xhigh"
# under [claude.mid] and [claude.high].
#
# This file is yours: the installer seeds it once and updates never overwrite
# it; deleting it is also fine (the defaults live in the engine). It holds no
# secrets, so committing it is fine when the whole team should share it. After
# /update-workspace, re-run sync-agents (updates reset the agent files to
# upstream defaults; `validate` warns while they drift).

# The cheap row falls back to the mid row by itself (executor-route prints a fallback= line)
# under a loopback ANTHROPIC_BASE_URL (ocx/Kiro serves no Haiku 5.5) and on Bedrock, Vertex and
# Foundry, where the `haiku` alias is Haiku 4.5; set ANTHROPIC_DEFAULT_HAIKU_MODEL there to keep it.
#
# Every row at its default: uncomment and edit to override. A row you set stops
# following later defaults; executor-route prints an override= line for each.
# [claude.high]
# model = "opus"    # e.g. "fable"
# effort = "high"
# [claude.research]
# model = "opus"
# effort = "high"
# [claude.design]
# model = "opus"    # design-drafter's own row
# effort = "high"
# [claude.critic]
# model = "opus"    # design-critic; may share the design row's model
# effort = "high"
# [claude.judge]
# model = "opus"    # alias only
# effort = "high"
# [claude.mid]
# model = "opus"
# effort = "medium"
# [claude.cheap]
# model = "haiku"   # alias only
# effort = "xhigh"
# [claude.explore]
# model = "haiku"
# effort = "xhigh"
