# Agentic workspace CI.
#
# It checks the workflow state (`validate`) on every push and
# pull request, and gates a phase/<phase id>-<slug> pull request (phase/P46-k2-<slug>,
# phase/P12-<slug> or phase/P-<token>-<slug>) on the quiet point.
#
# It is seeded once by the installer and never overwritten afterwards: this is your
# CI file, edit it freely.
name: workspace-ci

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: workflow state integrity
        run: python3 scripts/workflow.py validate

  # Quiet-point gate for parallel phase execution: a pull request from a
  # phase/<phase id>-<slug> branch (P46-k2, P12 or a minted P-<token>) is mergeable only when
  # that phase is done + review
  # pass on its own branch AND the default stream is quiet. GATE CLOSED exits
  # non-zero, so this check goes red; whether that blocks the merge is the repo's
  # branch-protection choice.
  parallel-gate:
    name: parallel quiet-point gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'phase/')
    steps:
      - uses: actions/checkout@v4
        with:
          # The phase branch's own tip (not the PR merge commit) is what the gate
          # must read, plus enough history to resolve the base branch.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: quiet point for the phase branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          # The branch formats parallel-start writes, phase/<phase id>-<slug>:
          #   phase/P46-k2-<slug> -> P46-k2  (a number and a two-symbol tail with a letter)
          #   phase/P12-<slug>    -> P12     (an old numbered id)
          #   phase/P-7kq2-<slug> -> P-7kq2  (a minted id: 4 lowercase base32 symbols)
          # A tail and a first slug word look alike (phase/P12-ab-x), so the tailed id wins only when its
          # phase folder exists in this head; otherwise the untailed number does.
          # branch-parse:begin
          phase=$(printf '%s\n' "$HEAD_REF" | sed -nE 's#^phase/(P([0-9]+|-[0-9a-hjkmnp-tv-z]{4}))-.*$#\1#p')
          tailed=$(printf '%s\n' "$HEAD_REF" | sed -nE 's#^phase/(P[0-9]+-([a-hjkmnp-tv-z][0-9a-hjkmnp-tv-z]|[0-9][a-hjkmnp-tv-z]))-.*$#\1#p')
          if [ -n "$tailed" ] && [ -f "works/phases/active/$tailed/phase.json" ]; then
            phase=$tailed
          fi
          # branch-parse:end
          if [ -z "$phase" ]; then
            echo "head branch '$HEAD_REF' is not phase/<phase id>-<slug> (P46-k2, P12 or P-<token>) -- nothing to gate"
            exit 0
          fi
          git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
          echo "gating $phase: branch=HEAD ($HEAD_REF) main=origin/$BASE_REF"
          python3 scripts/workflow.py parallel-gate "$phase" \
            --branch-ref HEAD --main-ref "origin/$BASE_REF"
