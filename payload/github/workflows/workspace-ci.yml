# Agentic workspace CI.
#
# It checks the workflow state (`check --no-rebuild`) on each pull request and each push to
# the default branch (a pushed branch runs once, through its pull request; name
# yours below if it is neither main nor master).
#
# It is seeded once by the installer and never overwritten afterwards: this is your
# CI file, edit it freely.
name: workspace-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: workflow state integrity
        run: python3 scripts/workflow.py check --no-rebuild

