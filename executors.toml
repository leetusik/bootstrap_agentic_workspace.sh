# Executor route table: per-row overrides of the engine's defaults.
#
# The engine owns one route table; this file overrides it row by row. The
# orchestrator passes each dispatch the row's model and effort; the agent
# files' frontmatter is only the fallback. Show the resolved table, or the
# routing decision for one slice, with
#
#   python3 scripts/workflow.py executor-route [<slice_id> [--retry]]
#
# and apply an edit to the agent files with
#
#   python3 scripts/workflow.py sync-agents
#
# The rows (default; what each serves):
#   high      opus @ high    review, decomposition, the co-work mockup span,
#                            any risk but low, every second attempt; the
#                            design-drafter follows it (slice-executor-high)
#   research  opus @ medium  research slices, by kind (slice-executor-high)
#   mid       sonnet @ high  implementation and fix rated low (slice-executor-mid)
#   cheap     = the mid row  docs and qa rated low; inherits the mid row unless
#                            overridden (slice-executor-mid)
#   explore   haiku @ high   read-only lookups (.claude/agents/Explore.md)
#
# Grammar: [claude.<row>] tables holding model = "..." and effort = "...",
# double-quoted. effort is low, medium, high, xhigh or max, or "" to write no
# effort line and pass no effort (for a model that rejects the parameter).
# mid, high and explore own an agent file, so they also take a full model id
# or "inherit"; research and cheap run another row's file, so they take an
# Agent-tool alias only (opus, sonnet, haiku, fable).
#
# From v52 or earlier: a top-level mode = "..." line is refused since v53 —
# delete it. flex was xhigh on both tiers; to keep it, set effort = "xhigh"
# under [claude.mid] and [claude.high].
#
# This file is yours: the installer seeds it once and updates never overwrite
# it; deleting it is also fine (the defaults live in the engine). It holds no
# secrets, so committing it is fine when the whole team should share it. After
# /update-workspace, re-run sync-agents (updates reset the agent files to
# upstream defaults; `validate` warns while they drift).

# The cheap route: docs and qa slices rated low run on Haiku 5.5 at high. On in this
# repository; the installer seeds it commented out because the `haiku` alias is Haiku 4.5
# on Bedrock, Vertex and Foundry — uncomment to opt in on the Anthropic API. Unset, the
# cheap row inherits the mid row. Under a loopback ANTHROPIC_BASE_URL (ocx/Kiro, no
# Haiku 5.5) executor-route falls back to the mid row's model by itself.
# cheap-route: begin
[claude.cheap]
model = "haiku"
effort = "high"
# cheap-route: end

# The other rows at their defaults: uncomment and edit to override.
# [claude.high]
# model = "opus"    # e.g. "fable"; design-drafter follows this row
# effort = "high"
# [claude.research]
# model = "opus"
# effort = "medium"
# [claude.mid]
# model = "sonnet"
# effort = "high"
# [claude.explore]
# model = "haiku"
# effort = "high"
