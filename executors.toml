# Executor-tier configuration for the slice-executor subagents.
# To switch the mode below in one step (rewrites the mode line and syncs the
# agent files), or run it bare to show the current mode:
#
#   python3 scripts/workflow.py executor-mode <economy|flex>
#
# For anything else, uncomment/edit what you want to change, then apply:
#
#   python3 scripts/workflow.py sync-agents
#
# With no active mode or overrides, the engine uses economy. The seed selects
# flex below, and the commented per-tier values show that preset. Two
# knobs, lowest precedence first:
#
#   1. mode — a named preset for both tiers (top level, before any table):
#        economy (default)  sonnet@high / opus@high
#        flex               sonnet@xhigh / opus@xhigh
#   2. Per-tier [claude.<tier>] tables — override the active preset field by
#      field.
#
# There are two tiers, and `mid` is the default (v46): it takes implementation,
# fix, docs and qa slices rated `low`, real code and multi-file work included.
# `high` takes decomposition, research, the phase review, a slice rated `high`
# for a named trigger (open design, a core invariant, an unlocated root cause,
# a wide blast radius) and every second attempt after mid. A slice's `risk`
# picks between them (`low` -> mid, anything else -> high).
#
# Values are written verbatim into the agent files, so model aliases
# (opus/sonnet), full model IDs, or "inherit" all work without code changes;
# haiku is deliberately never an executor tier. Set effort = "" to omit the
# effort line entirely — required for a model that rejects the effort
# parameter. Models may not be empty.
# This file is yours: the installer seeds it once and updates never overwrite
# it; deleting it is also fine (defaults live in the engine). It holds no
# secrets, so committing it is fine when the whole team should share the tier
# config. After /update-workspace, re-run sync-agents (updates reset the
# agent files to upstream defaults; `validate` warns while they drift).

mode = "flex"

# Claude Code (.claude/agents/slice-executor-{mid,high}.md) — flex values shown.
# The design subagent (.claude/agents/design-drafter.md) is not a tier of its own:
# sync-agents writes it the `high` values, so [claude.high] governs it too.
#[claude.mid]
#model = "sonnet"
#effort = "xhigh"
#[claude.high]
#model = "opus"    # e.g. "fable", or "claude-mythos-5" once available
#effort = "xhigh"
